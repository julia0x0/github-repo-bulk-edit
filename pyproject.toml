[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-bulk-edit"
version = "0.1.0"
description = "A vim-like terminal UI for bulk editing GitHub repository names, visibility, and archive state."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Julia" }
]
dependencies = []

[project.scripts]
github-repo-bulk-edit = "github_repo_bulk_edit.cli:main"

[tool.setuptools]
packages = ["github_repo_bulk_edit"]
